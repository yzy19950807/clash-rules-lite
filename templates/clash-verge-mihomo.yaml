# 7. 四段式低耗规则判断区
rules:
  # 第 1 段：隐私拦截、私网、Google CN 修复、国内银行/政务/直连
  - RULE-SET,reject_extra,REJECT
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  # Google 国内 CDN 修复（必须放在 DOMAIN-SUFFIX,cn,DIRECT 之前）
  - RULE-SET,google_cn_fix,🌐 Google & Meta

  # 国内银行、政务、财税与个人直连扩展
  - DOMAIN-SUFFIX,cn,DIRECT
  - RULE-SET,direct_cn_extra,DIRECT
  - RULE-SET,geolocation_cn_domain,DIRECT
  - RULE-SET,games_download_cn_domain,DIRECT
  - RULE-SET,apple_cn_domain,DIRECT
  - RULE-SET,microsoft_cn_domain,DIRECT
  - RULE-SET,samsung_cn_domain,DIRECT
  - RULE-SET,bilibili_domain,DIRECT
  - RULE-SET,bank_cn_domain,DIRECT
  - RULE-SET,icbc_domain,DIRECT
  - RULE-SET,ccb_domain,DIRECT
  - RULE-SET,boc_domain,DIRECT
  - RULE-SET,cmb_domain,DIRECT
  - RULE-SET,pingan_domain,DIRECT
  - RULE-SET,citic_domain,DIRECT

  # 第 2 段：海外核心业务精准分流
  - RULE-SET,bank_pay_extra,💳 支付与金融
  - RULE-SET,paypal_domain,💳 支付与金融
  - RULE-SET,stripe_domain,💳 支付与金融
  - RULE-SET,wise_domain,💳 支付与金融
  - RULE-SET,redotpay_domain,💳 支付与金融
  - RULE-SET,safepal_domain,💳 支付与金融

  - RULE-SET,web3_extra,🪙 Web3 服务
  - RULE-SET,crypto_domain,🪙 Web3 服务

  - RULE-SET,youtube_domain,🎬 影音流媒体
  - RULE-SET,netflix_domain,🎬 影音流媒体
  - RULE-SET,disney_domain,🎬 影音流媒体
  - RULE-SET,twitch_domain,🎬 影音流媒体

  - RULE-SET,googlefcm_domain,📢 FCM 推送

  - RULE-SET,meta_domain,🌐 Google & Meta
  - RULE-SET,whatsapp_domain,🌐 Google & Meta
  - RULE-SET,instagram_domain,🌐 Google & Meta
  - RULE-SET,google_domain,🌐 Google & Meta

  - RULE-SET,tiktok_domain,🎵 TikTok

  - RULE-SET,linkedin_domain,💬 海外社媒
  - RULE-SET,twitter_domain,💬 海外社媒
  - RULE-SET,telegram_domain,💬 海外社媒
  - RULE-SET,discord_domain,💬 海外社媒
  - RULE-SET,reddit_domain,💬 海外社媒

  - DOMAIN-SUFFIX,notion.so,🤖 AI 服务
  - RULE-SET,ai_domain,🤖 AI 服务

  # GitHub 必须在 microsoft_domain 之前（微软规则集内含 GitHub），确保走日常代理而非系统服务直连
  - RULE-SET,github_domain,🚀 日常代理

  - RULE-SET,apple_domain,📱 系统服务
  - RULE-SET,microsoft_domain,📱 系统服务
  - RULE-SET,samsung_domain,📱 系统服务

  - DOMAIN-SUFFIX,linux.do,🚀 日常代理

  # 第 3 段：其余已知海外域名
  - RULE-SET,geolocation_noncn_domain,🚀 日常代理

  # 第 4 段：IP 兜底与漏网之鱼
  - RULE-SET,cn_ip,DIRECT
  - RULE-SET,telegram_ip,💬 海外社媒,no-resolve
  - MATCH,🐟 漏网之鱼
