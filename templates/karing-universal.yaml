# 7. 四段式全量聚合规则判断区（仅 23 条，云端已自动去重与剔除冲突）
rules:
  # 第 1 段：隐私拦截、私网、Google CN 修复、全量国内直连
  - RULE-SET,reject_all,REJECT
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,google_cn_fix,🌐 Google & Meta
  - DOMAIN-SUFFIX,cn,DIRECT
  - RULE-SET,direct_cn_all,DIRECT

  # 第 2 段：海外核心业务精准分流
  - RULE-SET,pay_all,💳 支付与金融
  - RULE-SET,web3_all,🪙 Web3 服务
  - RULE-SET,media_all,🎬 影音流媒体
  - RULE-SET,googlefcm,📢 FCM 推送
  - RULE-SET,google_meta_all,🌐 Google & Meta
  - RULE-SET,tiktok,🎵 TikTok
  - RULE-SET,social_all,💬 海外社媒
  - RULE-SET,ai_all,🤖 AI 服务
  - RULE-SET,github,🚀 日常代理
  - RULE-SET,system_all,📱 系统服务
  - DOMAIN-SUFFIX,linux.do,🚀 日常代理

  # 第 3 段：其余已知海外域名
  - RULE-SET,noncn_all,🚀 日常代理

  # 第 4 段：IP 兜底（防止 App 直连 IP 漏网）与漏网之鱼
  - RULE-SET,meta_ip,🌐 Google & Meta,no-resolve
  - RULE-SET,media_ip,🎬 影音流媒体,no-resolve
  - RULE-SET,social_ip,💬 海外社媒,no-resolve
  - RULE-SET,cn_ip,DIRECT
  - MATCH,🐟 漏网之鱼
