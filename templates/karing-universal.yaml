# =====================================================================
# Karing (sing-box 内核) & Clash Verge Rev 公开脱敏模板 — B2B 外贸 / Web3 版
# =====================================================================
# 说明:
# 1. 全部规则集使用标准 .yaml 格式，兼容 Karing (sing-box) 与 Clash Verge Rev。
# 2. 自定义规则直接从 yzy19950807/clash-rules-lite@release 拉取，方便多端同步。
# 3. 本模板仅含示例占位节点与占位订阅，使用前请替换为你的真实节点与订阅链接。
# =====================================================================

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
external-controller: "127.0.0.1:9090"
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "*.cn"
    - "+.gov.cn"
    - "+.home"
    - "time.*.com"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "*.msftncsi.com"
    - "www.msftconnecttest.com"
    - "+.weixin.qq.com"
    - "+.qq.com"
    - "+.bjsinglewindow.com"
    - "+.alipay.com"
    - "+.alipayobjects.com"
    - "+.alipaydns.com"
    - "+.antgroup.com"
    - "+.95588.com"
    - "+.icbc.com"
    - "+.ccb.com"
    - "+.bankofchina.com"
    - "+.bank-of-china.com"
    - "+.cmbchina.com"
    - "+.8008205555.com"
    - "+.cmbimg.com"
    - "+.pingan.com"
    - "+.1qianbao.com"
    - "+.lufax.com"
    - "+.citicbank.com"
    - "+.ecitic.com"
    - "+.abchina.com"
    - "+.bankcomm.com"
    - "+.psbc.com"
    - "+.cebbank.com"
    - "+.unionpay.com"
    - "+.95516.com"
    - "+.95516.net"
    - "+.95508.com"
    - "+.webank.com"
    - "+.chinapay.com"
    - "+.chinaums.com"
  default-nameserver:
    - "223.5.5.5"
    - "119.29.29.29"
  proxy-server-nameserver:
    - "223.5.5.5"
    - "119.29.29.29"
  nameserver:
    - "https://cloudflare-dns.com/dns-query"
    - "https://dns.google/dns-query"

hosts:
  "doh.pub": ["1.12.12.12", "120.53.53.53"]
  "cloudflare-dns.com": ["1.1.1.1", "1.0.0.1"]
  "dns.google": ["8.8.8.8", "8.8.4.4"]
  "services.googleapis.cn": "services.googleapis.com"

# 3. [示例占位节点] 请替换为你的真实自建与链式节点
proxies:
  - { name: "自建-美国专线", type: vless, server: us-direct.example.com, port: 443, uuid: 00000000-0000-0000-0000-000000000001, network: tcp, tls: true, udp: true, flow: xtls-rprx-vision, servername: example.com, client-fingerprint: chrome }
  - { name: "自建-美国家宽", type: vless, server: us-isp.example.com, port: 443, uuid: 00000000-0000-0000-0000-000000000002, network: tcp, tls: true, udp: true, flow: xtls-rprx-vision, servername: example.com, client-fingerprint: chrome }
  - { name: "自建-日本主力", type: vless, server: jp.example.com, port: 443, uuid: 00000000-0000-0000-0000-000000000003, network: tcp, tls: true, udp: true, flow: xtls-rprx-vision, servername: example.com, client-fingerprint: chrome }
  - { name: "自建-欧洲主力", type: vless, server: eu.example.com, port: 443, uuid: 00000000-0000-0000-0000-000000000004, network: tcp, tls: true, udp: true, flow: xtls-rprx-vision, servername: example.com, client-fingerprint: chrome }
  - { name: "🔗 链式-美国家宽", type: socks5, server: chain-us.example.com, port: 1080, username: user, password: CHANGE_ME, dialer-proxy: "✈️ 机场跳板选择" }
  - { name: "🔗 链式-南美", type: socks5, server: chain-sa.example.com, port: 1080, username: user, password: CHANGE_ME, dialer-proxy: "👆 顶尖中转" }

# 4. [示例占位订阅] 请替换为你的真实机场订阅链接
proxy-providers:
  Airport_Main:
    type: http
    url: "https://example.com/airport-main-subscription"
    path: ./profiles/airport_main.yaml
    interval: 43200
    health-check: { enable: true, interval: 600, url: "https://www.gstatic.com/generate_204" }

  Airport_Backup_A:
    type: http
    url: "https://example.com/airport-backup-a-subscription"
    path: ./profiles/airport_backup_a.yaml
    interval: 43200
    health-check: { enable: true, interval: 600, url: "https://www.gstatic.com/generate_204" }

  Airport_Backup_B:
    type: http
    url: "https://example.com/airport-backup-b-subscription"
    path: ./profiles/airport_backup_b.yaml
    interval: 43200
    health-check: { enable: true, interval: 600, url: "https://www.gstatic.com/generate_204" }

