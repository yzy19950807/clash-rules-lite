name: Build & Publish Clash Rules

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'rules/**'
      - 'templates/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Mihomo binary
        run: |
          TAG=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name')
          echo "Mihomo latest tag: $TAG"
          curl -sSL "https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-amd64-v1-${TAG}.gz" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Compile .mrs and stage publish files
        run: |
          mkdir -p publish/templates
          for f in rules/*.yaml; do
            name=$(basename "$f" .yaml)
            cp "$f" "publish/${name}.yaml"
            ./mihomo convert-ruleset domain yaml "$f" "publish/${name}.mrs"
            test -s "publish/${name}.mrs"
          done
          cp templates/*.yaml publish/templates/
          echo "RELEASE_NAME=Released on $(date -u +%Y.%m.%d-%H:%M) UTC" >> "$GITHUB_ENV"
          echo "TAG_NAME=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - name: Validate Mihomo template
        run: |
          mkdir -p /tmp/mihomo_ci/profiles /tmp/mihomo_ci/ruleset
          printf "proxies:\n  - {name: dummy, type: direct}\n" > /tmp/mihomo_ci/profiles/airport_main.yaml
          cp /tmp/mihomo_ci/profiles/airport_main.yaml /tmp/mihomo_ci/profiles/airport_backup_a.yaml
          cp /tmp/mihomo_ci/profiles/airport_main.yaml /tmp/mihomo_ci/profiles/airport_backup_b.yaml
          sed 's|type: http|type: file|g' publish/templates/clash-verge-mihomo.yaml \
            | awk '/^proxy-providers:/{pp=1} /^proxy-groups:/{pp=0} pp && /url:/{next} {print}' > /tmp/mihomo_ci/test.yaml
          ./mihomo -d /tmp/mihomo_ci -t -f /tmp/mihomo_ci/test.yaml

      - name: Push to release branch
        run: |
          cd publish
          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          files: |
            publish/*.mrs
            publish/*.yaml
            publish/templates/*.yaml

      - name: Purge jsDelivr CDN
        run: |
          for file in publish/*.mrs publish/*.yaml; do
            fname=$(basename "$file")
            curl -sf "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${fname}" || true
          done
